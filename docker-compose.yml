# Client only. The Vowly API must be running separately (default http://localhost:4000 on the host).
services:
  client:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3303
    image: vowly-client
    ports:
      - "3303:3303"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
